version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plc
      POSTGRES_PASSWORD: plc
      POSTGRES_DB: plc_election
    ports:
      - "5432:5432"
    volumes:
      - plc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plc"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://plc:plc@postgres:5432/plc_election
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./services/api:/srv/services/api
      - ./services/forecasting:/srv/services/forecasting
      - ./packages/election_rules_py:/srv/packages/election_rules_py

volumes:
  plc_postgres_data:
