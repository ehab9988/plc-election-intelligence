name: Ingestion Cycle (free-tier scheduler)

# Replaces a paid always-on Celery worker for anyone who can't run a
# server: this runs scripts/run_ingestion_cycle.py on a schedule using a
# fresh, free GitHub Actions runner each time. See
# docs/FREE_TIER_DEPLOYMENT.md for the full setup (free Postgres, free
# API hosting, required repo secrets) and its honest limitations
# (schedule can be delayed under GitHub load; disabled after 60 days of
# repository inactivity).
#
# Requires these repository secrets (Settings -> Secrets and variables ->
# Actions) to do anything useful — with none set, the job still runs but
# every job will fail fast on a missing DATABASE_URL:
#   DATABASE_URL            postgresql+psycopg://... (a free Neon/Supabase instance)
#   ANTHROPIC_API_KEY        optional, for NLP_PROVIDER=anthropic_compatible
#   OPENAI_API_KEY           optional, for NLP_PROVIDER=openai_compatible
# And this repository variable (same Settings page, "Variables" tab):
#   NLP_PROVIDER             rules | anthropic_compatible | openai_compatible (defaults to "rules")

on:
  schedule:
    # Every 15 minutes: ingest news + recompute the forecast if a new
    # verified poll exists. Free and unrestricted on a public repo.
    - cron: "*/15 * * * *"
    # Once daily: also run the heavier coalition-signal scan.
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      with_coalition_scan:
        description: "Also run the coalition-signal scan"
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install local packages
        # services/forecasting and services/api's pyproject.toml declare
        # almost no dependencies (their real dependency lists live in
        # requirements.txt) — `pip install -e <path>` alone only makes the
        # package importable, it does NOT install fastapi/pydantic-settings/
        # sqlalchemy/numpy/pandas/etc. Installing each requirements.txt
        # from its own directory (not repo root) also matters: both files
        # contain relative `-e ../../packages/election_rules_py`-style
        # lines that pip resolves against the CURRENT directory, not the
        # requirements.txt's location.
        run: |
          pip install -e packages/election_rules_py
          (cd services/forecasting && pip install -r requirements.txt)
          (cd services/api && pip install -r requirements.txt)
          pip install -r services/ingestion/requirements-cron.txt

      - name: Run ingestion cycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NLP_PROVIDER: ${{ vars.NLP_PROVIDER || 'rules' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 2 * * *" ] || [ "${{ github.event.inputs.with_coalition_scan }}" = "true" ]; then
            python scripts/run_ingestion_cycle.py --with-coalition-scan
          else
            python scripts/run_ingestion_cycle.py
          fi
